<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>E Grubu Vardiya Takvimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F3F5;
    --surface:#FFFFFF;
    --ink:#1C232B;
    --ink-muted:#6B7480;
    --line:#E1E4E8;
    --gece:#A63368;      --gece-soft:#F4E4EC;
    --dort:#3EA55E;      --dort-soft:#E5F5EA;
    --gunduz:#3E82F1;    --gunduz-soft:#E7EFFD;
    --rest:#9AA1AC;      --rest-soft:#EDEFF1;
    --hat:#C98A2B;       --hat-soft:#FBF0DC;
    --saha:#4C5B73;      --saha-soft:#EAEDF1;
    --rz:#B23A3A;        --rz-soft:#FAE7E7;
    --radius:14px;
    --shadow:0 1px 2px rgba(28,35,43,.06), 0 4px 14px rgba(28,35,43,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .brand{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:19px;color:var(--ink);
    display:flex;flex-direction:column;line-height:1.05;
  }
  .brand small{font-family:'Inter',sans-serif;font-weight:500;font-size:11px;color:var(--ink-muted);letter-spacing:.4px;text-transform:uppercase;}
  .spacer{flex:1;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    font-size:17px;color:var(--ink);
  }
  .icon-btn:active{background:var(--bg);}
  .person-chip{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--surface);
    border-radius:20px;padding:5px 12px 5px 5px;
  }
  .avatar{
    width:28px;height:28px;border-radius:50%;
    background:var(--gece);color:#fff;font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;
  }
  .person-chip span{font-size:13.5px;font-weight:600;}

  /* ---------- landing ---------- */
  .landing{max-width:520px;margin:0 auto;padding:38px 20px 20px;}
  .landing h1{font-size:30px;margin:0 0 2px;}
  .landing p.lead{color:var(--ink-muted);font-size:14.5px;margin:0 0 26px;}
  .badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .id-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 14px;
    display:flex;flex-direction:column;gap:10px;
    position:relative;overflow:hidden;
    text-align:left;
  }
  .id-card:active{transform:scale(.98);}
  .id-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gece);
  }
  .id-card.group::before{background:var(--hat);}
  .id-card .num{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);
    letter-spacing:.5px;
  }
  .id-card .who{display:flex;align-items:center;gap:10px;}
  .id-card .avatar{width:36px;height:36px;font-size:14px;}
  .id-card .name{font-weight:700;font-size:15px;line-height:1.15;}
  .id-card .role{font-size:11.5px;color:var(--ink-muted);}
  .id-card.group .avatar{background:var(--hat);}

  /* ---------- calendar screen ---------- */
  .wrap{max-width:640px;margin:0 auto;padding:6px 14px 10px;}
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0 6px;margin-bottom:2px;
  }
  .month-nav .navbtn{background:none;border:none;font-size:30px;color:var(--ink-muted);width:46px;height:46px;border-radius:11px;}
  .month-nav .navbtn:active{background:var(--bg);}
  .month-label{font-size:34px;font-weight:700;text-align:left;line-height:1;}
  .month-label small{display:inline-block;margin-left:8px;font-family:'Inter';font-weight:600;font-size:15px;color:var(--ink-muted);letter-spacing:0;text-transform:none;vertical-align:middle;}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0 6px;padding:0 2px;}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-muted);font-weight:600;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dow{text-align:center;font-size:11px;font-weight:600;color:var(--ink-muted);padding-bottom:7px;}
  .weekrow{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;}
  .weekrow:last-child{border-bottom:none;}
  .cell{
    background:transparent;border:none;border-radius:0;
    min-height:52px;padding:3px 2px 0;position:relative;display:flex;flex-direction:column;
    align-items:center;gap:4px;overflow:hidden;
  }
  .cell.empty{background:transparent;}
  .cell .datenum{
    font-size:15px;font-weight:700;color:var(--ink);width:23px;height:23px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
  }
  .cell.rest .datenum{color:var(--ink-muted);font-weight:600;}
  .cell.today .datenum{background:var(--ink);color:#fff;}
  .chip{
    width:100%;box-sizing:border-box;text-align:center;font-size:8.5px;font-weight:700;
    padding:4px 1px;border-radius:7px;color:#fff;letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .taskcode{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;
    border-radius:6px;padding:1px 5px;
  }
  .saha-tag{font-size:8px;font-weight:600;color:var(--ink-muted);}
  .rz-tag{font-size:8px;font-weight:700;color:var(--rz);}
  .rest-tag{display:none;}

  .chip.gece{background:var(--gece);}
  .chip.dort{background:var(--dort);}
  .chip.gunduz{background:var(--gunduz);}
  .taskcode.hat{background:var(--hat-soft);color:var(--hat);}
  .taskcode.rz{background:var(--rz-soft);color:var(--rz);}

  /* ---------- modal (day detail) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,29,.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
    padding:18px 18px 26px;max-height:82vh;overflow-y:auto;
  }
  .sheet-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
  .sheet h2{font-size:22px;margin:0 0 2px;}
  .sheet .sub{color:var(--ink-muted);font-size:13px;margin-bottom:14px;}
  .info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--ink-muted);}
  .info-row .v{font-weight:600;text-align:right;}
  .person-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .person-table th{text-align:left;font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;padding:6px 4px;letter-spacing:.4px;border-bottom:1px solid var(--line);}
  .person-table td{padding:8px 4px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .person-table tr:last-child td{border-bottom:none;}
  .close-sheet{
    width:100%;margin-top:16px;background:var(--ink);color:#fff;border:none;
    border-radius:12px;padding:13px;font-weight:700;font-size:14.5px;
  }

  /* ---------- settings ---------- */
  .settings-sheet .field{margin-bottom:16px;}
  .settings-sheet label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .settings-sheet input[type=text],.settings-sheet input[type=date],.settings-sheet input[type=number],.settings-sheet select{
    width:100%;height:46px;padding:0 11px;border:1px solid var(--line);border-radius:10px;
    font-size:14.5px;font-family:inherit;background:var(--bg);box-sizing:border-box;
    -webkit-appearance:none;appearance:none;line-height:normal;vertical-align:middle;
  }
  .settings-sheet select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%239AA1AC'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;background-size:16px;padding-right:32px;
  }
  .person-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .ht-row{margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--line);}
  .ht-row:last-child{border-bottom:none;}
  .flip-label{display:block;font-size:12px;color:var(--ink-muted);line-height:1.4;font-weight:500;text-transform:none;letter-spacing:0;}
  .person-row input{flex:1;}
  .rm-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--rz);font-weight:700;}
  .add-btn{width:100%;border:1px dashed var(--line);border-radius:10px;padding:10px;background:none;color:var(--ink-muted);font-weight:600;font-size:13.5px;}
  .save-btn{width:100%;background:var(--gece);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:14.5px;margin-top:6px;}
  .cancel-btn{width:100%;background:none;color:var(--ink-muted);border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:700;font-size:14.5px;margin-top:6px;}
  .acc-btn-row{display:flex;gap:8px;margin-top:14px;}
  .acc-btn-row .save-btn,.acc-btn-row .cancel-btn{margin-top:0;flex:1;}
  .hint{font-size:11.5px;color:var(--ink-muted);line-height:1.5;margin-top:4px;}
  .switch-link{display:block;text-align:center;margin-top:18px;color:var(--gece);font-weight:600;font-size:13.5px;background:none;border:none;width:100%;padding:8px;}

  /* ---------- ayarlar akordeonu (Daha fazla) ---------- */
  .accordion{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--surface);}
  .accordion-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:15px 16px;background:none;border:none;text-align:left;font-size:15px;font-weight:700;color:var(--ink);
  }
  .accordion-head .chev{color:var(--ink-muted);font-size:13px;transition:transform .15s ease;flex:0 0 auto;}
  .accordion.open .accordion-head .chev{transform:rotate(90deg);}
  .accordion-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px;}
  .accordion.open .accordion-body{display:block;}

  /* ---------- raporlar (takvim görünümlü PDF) ---------- */
  .report-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin:0 0 10px;}
  .report-dow-row{margin-bottom:2px;}
  .report-grid-person .cell{min-height:64px;}
  .report-grid-group .cell{min-height:96px;}
  .report-group-tasks{width:100%;font-size:7px;line-height:1.35;color:var(--ink-muted);text-align:left;padding:0 2px;}
  .report-group-tasks div{display:flex;justify-content:space-between;gap:3px;}
  .report-group-tasks b{color:var(--ink);font-weight:700;}
  .report-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-size:11px;color:var(--ink-muted);}
  .report-legend b{color:var(--ink);}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
    @page{ size:landscape; margin:10mm; }
  }

  /* ---------- mesailer ---------- */
  .mesai-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .mesai-summary-card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;flex-direction:column;gap:3px;
  }
  .mesai-summary-card b{font-size:12.5px;color:var(--ink);}
  .mesai-summary-card span{font-size:14px;font-weight:700;color:var(--gece);}
  .mesai-summary-solo{grid-column:1 / -1;}
  .mesai-suggest-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .mesai-suggest-row:last-child{border-bottom:none;}
  .mesai-suggest-btn{width:auto;padding:6px 12px;font-size:12.5px;border-radius:8px;flex:0 0 auto;}
  .mesai-log-row{
    position:relative;padding:10px 70px 10px 0;border-bottom:1px solid var(--line);
  }
  .mesai-log-row:last-child{border-bottom:none;}
  .mesai-log-main{font-size:13.5px;color:var(--ink);}
  .mesai-log-note{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .mesai-del-btn{
    position:absolute;right:0;top:10px;background:none;border:1px solid var(--line);
    color:var(--rz);font-weight:700;font-size:12px;border-radius:8px;padding:5px 10px;
  }
  .mesai-add-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-top:18px;
  }
  .mesai-add-card label{margin-bottom:10px;}
  .mesai-add-card .field-row{display:flex;gap:8px;margin-bottom:10px;}
  .mesai-add-card .field-row > *{flex:1;min-width:0;}
  .mesai-add-card input,.mesai-add-card select{margin-bottom:10px;}
  .mesai-add-card input:last-of-type{margin-bottom:0;}
  .mesai-add-card .save-btn{margin-top:4px;}

  /* ---------- bottom tab bar ---------- */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;align-items:flex-start;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .navtab{
    background:none;border:none;flex:1;display:flex;flex-direction:column;align-items:center;
    gap:3px;color:var(--ink-muted);font-size:11px;font-weight:600;padding:4px 2px;border-radius:12px;
  }
  .navtab svg{display:block;}
  .navtab.active{color:var(--ink);}
  .navtab .navtab-pill{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border-radius:14px;padding:6px 14px 5px;margin-top:-6px;
  }
  .navtab.active .navtab-pill{background:var(--bg);}

  /* ---------- placeholder screens ---------- */
  .placeholder-screen{min-height:100vh;}
  .placeholder-body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:60px 30px;color:var(--ink-muted);gap:14px;
  }
  .placeholder-icon{
    width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-muted);
  }
  .placeholder-body p{font-size:14px;font-weight:600;margin:0;}
</style>
</head>
<body>

<!-- ============ LANDING (kişi seçimi) ============ -->
<div id="screen-landing" class="landing">
  <h1>E Grubu Vardiya Takvimi</h1>
  <p class="lead">Erdemir 2. Soğuk CAL &middot; Devam etmek için kendini seç</p>
  <div id="badgeGrid" class="badge-grid"></div>
</div>

<!-- ============ CALENDAR ============ -->
<div id="screen-calendar" class="hidden">
  <div class="topbar">
    <div class="person-chip" id="btnSwitchPerson">
      <span class="avatar" id="chipAvatar">EG</span>
      <span id="chipName">Grup</span>
    </div>
    <div class="brand"><small>Erdemir 2. Soğuk CAL</small>E Grubu</div>
    <div class="spacer"></div>
  </div>

  <div class="wrap">
    <div class="month-nav">
      <div class="month-label"><span id="monthLabel"></span><small id="yearLabel"></small></div>
      <div style="display:flex;">
        <button class="navbtn" id="prevMonth">&#8249;</button>
        <button class="navbtn" id="nextMonth">&#8250;</button>
      </div>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:var(--gece)"></i>Gece</span>
      <span><i class="dot" style="background:var(--dort)"></i>Dört</span>
      <span><i class="dot" style="background:var(--gunduz)"></i>Gündüz</span>
      <span><i class="dot" style="background:var(--rest)"></i>HT</span>
      <span><i class="dot" style="background:var(--hat)"></i>Hat görevi</span>
    </div>

    <div class="grid7" id="dowRow"></div>
    <div id="calGrid" style="margin-top:2px;"></div>
  </div>
</div>

<!-- ============ PLACEHOLDER SCREENS (yakında dolduracağız) ============ -->
<div id="screen-reports" class="hidden placeholder-screen">
  <div class="topbar">
    <div class="brand"><small>Erdemir 2. Soğuk CAL</small>Raporlar</div>
  </div>
  <div class="wrap" id="reportsContent"></div>
</div>

<div id="screen-mesailer" class="hidden placeholder-screen">
  <div class="topbar">
    <div class="brand"><small>Erdemir 2. Soğuk CAL</small>Mesailer</div>
  </div>
  <div class="wrap" id="mesailerContent"></div>
</div>

<div id="screen-more" class="hidden placeholder-screen">
  <div class="topbar">
    <div class="brand"><small>Erdemir 2. Soğuk CAL</small>Daha fazla</div>
  </div>
  <div class="wrap" id="moreContent"></div>
</div>

<!-- ============ ALT MENÜ (BOTTOM TAB BAR) ============ -->
<div id="bottomNav" class="hidden bottomnav">
  <button class="navtab active" id="tabTakvim" data-tab="takvim">
    <span class="navtab-pill">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      <span>Takvim</span>
    </span>
  </button>
  <button class="navtab" id="tabRaporlar" data-tab="raporlar">
    <span class="navtab-pill">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="3.6" height="10" rx="1"/><rect x="10.2" y="6" width="3.6" height="14" rx="1"/><rect x="16.4" y="13" width="3.6" height="7" rx="1"/></svg>
      <span>Raporlar</span>
    </span>
  </button>
  <button class="navtab" id="tabMesailer" data-tab="mesailer">
    <span class="navtab-pill">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/><path d="M8 12h8M8 15.5h8M8 9h4"/></svg>
      <span>Mesailer</span>
    </span>
  </button>
  <button class="navtab" id="tabDahaFazla" data-tab="dahafazla">
    <span class="navtab-pill">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="15" cy="7" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="9" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="17" cy="17" r="2" fill="currentColor" stroke="none"/></svg>
      <span>Daha fazla</span>
    </span>
  </button>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     AYARLAR / VERİ SAKLAMA
  ============================================================ */
  var STORAGE_KEY = 'erdemirVardiyaSettings_v1';
  // Koddaki vardiya/görev takvim kalibrasyonu değiştiğinde bu sayıyı artır.
  // Telefonda daha önce kaydedilmiş eski ayarlar bu takvim alanlarını
  // geçersiz kılmasın diye, sürüm eskiyse bu alanlar koddaki güncel
  // değerlerle değiştirilir (personel adları ve seçili kişi gibi kişisel
  // tercihler dokunulmadan kalır).
  var CALIBRATION_VERSION = 3;
  var defaultSettings = {
    personnel: ["Berke Aygün","Tarık Yıldırım","Fatih Karaduman","Abdullah Tuna","Sabri Can Yeşiltaş","Burak Özdemir"],
    vardiyaRef: "2026-09-06",   // Gece vardiyası 1. gün (kısa dönüşle güncellendi). Bu tarihten ÖNCESİ artık gösterilmiyor/hesaplanmıyor.
    gorevRef: "2026-09-07",     // Hat görev referansı (6. hat günü tablosu) - yeni vardiya düzenindeki ilk Hat günü
    gorevAnchorAssignment: ['S','A','K','6','Y','P'], // gorevRef (7 Eylül 2026) gününde personel[i]'nin görevi: Berke-Sıkma, Tarık-Arka, Fatih-Konveyör, Abdullah-Hat6, Sabri Can-Yağ, Burak-Paket (3 Eylül'deki bilinen atamadan bir hat-günü ileri taşınarak hesaplandı)
    taskCycleOrder: ['Y','P','S','6','K','A'], // Yağ→Paket→Sıkma→Hat6→Konveyör→Arka→(tekrar Yağ)
    htOverrides: [],            // ["YYYY-MM-DD", ...] - amirlerin duyurduğu yeni/erken HT günleri
    currentPerson: null,        // index içine personel adı ya da "__GROUP__"
    calibrationVersion: CALIBRATION_VERSION
  };
  var CALIBRATION_FIELDS = ['vardiyaRef','gorevRef','gorevAnchorAssignment','taskCycleOrder','htOverrides'];

  function loadSettings(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        var merged = Object.assign({}, defaultSettings, parsed);
        if(!parsed.calibrationVersion || parsed.calibrationVersion < CALIBRATION_VERSION){
          CALIBRATION_FIELDS.forEach(function(key){ merged[key] = defaultSettings[key]; });
          merged.calibrationVersion = CALIBRATION_VERSION;
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(merged)); }catch(e){}
        }
        return merged;
      }
    }catch(e){ /* localStorage yoksa (ör. file:// iOS) bellekte devam */ }
    return Object.assign({}, defaultSettings);
  }
  function saveSettings(){
    state.settings.calibrationVersion = CALIBRATION_VERSION;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.settings)); }catch(e){}
  }

  var state = { settings: loadSettings(), viewYear:null, viewMonth:null };

  var today = new Date(); today.setHours(0,0,0,0);
  state.viewYear = today.getFullYear();
  state.viewMonth = today.getMonth();

  /* ============================================================
     VARDİYA / GÖREV HESAPLAMA MOTORU
  ============================================================ */
  var TASK_NAMES = {Y:'Yağ',P:'Paket',S:'Sıkma',K:'Konveyör',A:'Arka',"6":'Hat 6'};
  // Görev döngü sırası: her hat gününde bir kişinin bir sonraki hat gününde
  // hangi göreve geçeceğini belirler (ayarlardan değiştirilebilir).
  function masterOrder(){ return state.settings.taskCycleOrder || defaultSettings.taskCycleOrder; }
  // Tablo(1..6): görev rotasyonu referans tarihi (gorevRef) her zaman tablo 6'ya denk gelir.
  // gorevAnchorAssignment, o tarihte personel[i]'nin görevini tutar (ayarlardan değiştirilebilir).
  // Diğer tüm tablolar buradan matematiksel olarak türetilir (madde 18 dönüşüm mantığı korunur).
  function tableForNumber(tnum){
    var order = masterOrder();
    var anchor = state.settings.gorevAnchorAssignment || defaultSettings.gorevAnchorAssignment;
    return anchor.map(function(task){
      var idx = order.indexOf(task);
      if(idx === -1) idx = 0;
      return order[(idx + tnum) % 6];
    });
  }
  var SHIFT_SEQUENCE = ['Gece','Dört','Gündüz'];

  function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function isoStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDays(date,n){ var d=new Date(date); d.setDate(d.getDate()+n); return d; }
  function refDate(){ return parseISO(state.settings.vardiyaRef); }
  function anchorDate(){ return parseISO(state.settings.gorevRef); }
  function daysDiff(a,b){ return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000); }

  // HT değişikliği kayıtları {date, flipFromDay} biçiminde: flipFromDay dolu ise
  // o bloğun YALNIZCA o günden itibaren (dahil) Hat/Saha sırası tersine çevrilir;
  // önceki günler normal sırasında kalır. Eski sürümden kalma düz metin/boolean
  // kayıtlarla geriye dönük uyumludur.
  function normalizedOverrides(){
    return (state.settings.htOverrides || []).map(function(o){
      if(typeof o === 'string') return {date:o, flipFromDay:null};
      var ffd = null;
      if(o.flipFromDay){ ffd = +o.flipFromDay; }
      else if(o.flip){ ffd = 1; } // eski boolean kayıt: tüm blok tersine
      return {date:o.date, flipFromDay: ffd};
    }).filter(function(o){ return !!o.date; });
  }
  function sortedOverrides(){
    var arr = normalizedOverrides();
    arr.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    return arr.map(function(o){ return {dateObj: parseISO(o.date), flipFromDay: o.flipFromDay}; });
  }

  // Bir bloğun belirli bir günü Hat mı Saha mı? flipFromDay doluysa ve blockDay ondan
  // büyük ya da eşitse sıra tersine döner, öncesi normal kalır.
  function isHatDay(shiftType, blockDay, flipFromDay){
    var base = (shiftType === 'Gündüz') ? (blockDay % 2 === 1) : (blockDay % 2 === 0);
    if(flipFromDay && blockDay >= flipFromDay) return !base;
    return base;
  }

  // ---- Blok tabanlı vardiya takvimi (HT değişikliklerini/kısa dönüşleri destekler) ----
  // Vardiya referans tarihinden başlayarak 6 çalışma günü + 1 HT gününden oluşan bloklar
  // üretir. Bir "hafta tatili değişikliği" o bloğun normal 6. gününden ÖNCE düşüyorsa,
  // blok o tarihte erken biter (kısa dönüş) ve bir sonraki blok ondan hemen sonra,
  // vardiya sırasında (Gece→Dört→Gündüz→Gece...) bir adım ileri giderek başlar.
  // Bu sayede HT değişiminden ÖNCEKİ tüm tarihler birebir aynı kalır.
  var scheduleCache = null;
  function buildScheduleUntil(targetDate){
    var overrides = sortedOverrides();
    var cacheKey = state.settings.vardiyaRef + '|' + JSON.stringify(state.settings.htOverrides||[]);
    if(scheduleCache && scheduleCache.key === cacheKey && scheduleCache.builtUntil > +targetDate){
      return scheduleCache.blocks;
    }
    var blocks = [];
    var usedIdx = 0;
    var shiftIdx = 0;
    var curStart = refDate();
    var safety = 0;
    while(curStart <= targetDate && safety < 8000){
      safety++;
      var normalHt = addDays(curStart,6);
      var htDate = normalHt;
      var flipFromDay = null;
      while(usedIdx < overrides.length){
        var od = overrides[usedIdx].dateObj;
        var db = daysDiff(curStart, od);
        if(db < 0){ usedIdx++; continue; } // geçmişte kalmış/kullanılamayan kayıt
        if(db <= 5){ htDate = od; flipFromDay = overrides[usedIdx].flipFromDay; usedIdx++; break; }
        break; // bu override bu bloğun penceresinde değil, sıradaki bloğu bekle
      }
      blocks.push({shiftType: SHIFT_SEQUENCE[shiftIdx], start: curStart, htDate: htDate, flipFromDay: flipFromDay});
      shiftIdx = (shiftIdx+1) % 3;
      curStart = addDays(htDate,1);
    }
    scheduleCache = {blocks: blocks, builtUntil: +curStart, key: cacheKey};
    return blocks;
  }

  function findBlockFor(date){
    var target = date > refDate() ? date : refDate();
    var blocks = buildScheduleUntil(target);
    for(var i=blocks.length-1;i>=0;i--){ if(blocks[i].start <= date) return blocks[i]; }
    return blocks[0];
  }

  function dayInfo(date){
    if(date < refDate()){
      // Vardiya referans tarihinden önceki günler artık gösterilmiyor
      // (kısa dönüşle referans tarihi ileri alındı, önceki düzen silindi).
      // noData:true, gerçek bir HT (dinlenme) gününden ayırt edilebilsin diye
      // (ör. Mesailer'in "boş" günleri mesai adayı sanmaması için).
      return {shiftType:null, isRest:true, blockDay:null, hatSaha:null, noData:true};
    }
    var block = findBlockFor(date);
    var info = {shiftType: block.shiftType, isRest:false, blockDay:null, hatSaha:null};
    if(daysDiff(date, block.htDate) === 0){ info.isRest = true; info.shiftType = null; return info; }
    info.blockDay = daysDiff(block.start, date) + 1;
    info.hatSaha = isHatDay(block.shiftType, info.blockDay, block.flipFromDay) ? 'Hat' : 'Saha';
    return info;
  }

  function hatBlockDaysOf(block){
    var len = daysDiff(block.start, block.htDate);
    var days = [];
    for(var bd=1; bd<=len; bd++){
      if(isHatDay(block.shiftType, bd, block.flipFromDay)) days.push(bd);
    }
    return days;
  }

  // Her Hat gününe, görev rotasyon tablosunu belirlemek için ardışık bir "H" indeksi atar.
  // Dört bloğunun son (Hat) günüyle Gündüz bloğunun ilk (Hat) günü bitişikse (aralarında
  // sadece HT günü varsa), ikinci gün rotasyonu ilerletmez - aynı tabloyu tekrarlar.
  function buildHatIndexMap(targetDate){
    var blocks = buildScheduleUntil(targetDate);
    var map = {};
    var runningH = -1;
    var prevBlockLastHat = null;
    for(var bi=0; bi<blocks.length; bi++){
      var block = blocks[bi];
      var hatDays = hatBlockDaysOf(block);
      var lenBlock = daysDiff(block.start, block.htDate);
      for(var hi=0; hi<hatDays.length; hi++){
        var bd = hatDays[hi];
        var repeat = (hi === 0 && bd === 1 && prevBlockLastHat === true);
        if(!repeat) runningH++;
        map[isoStr(addDays(block.start, bd-1))] = runningH;
      }
      prevBlockLastHat = isHatDay(block.shiftType, lenBlock, block.flipFromDay);
    }
    return map;
  }

  function tableNumberFor(date){
    var target = date > anchorDate() ? date : anchorDate();
    var map = buildHatIndexMap(target);
    var hDate = map[isoStr(date)];
    var hAnchor = map[isoStr(anchorDate())];
    if(hDate === undefined || hAnchor === undefined) return null;
    var delta = hDate - hAnchor;
    return (((6 - 1 + delta) % 6) + 6) % 6 + 1;
  }

  function hatOffsetGeneric(date){
    var target = date > anchorDate() ? date : anchorDate();
    var map = buildHatIndexMap(target);
    var h = map[isoStr(date)];
    if(h === undefined) return 0;
    return ((h % 6) + 6) % 6;
  }

  function prevWorkDay(date){
    var d = new Date(date);
    var guard = 0;
    while(guard < 400){
      d.setDate(d.getDate()-1);
      guard++;
      if(d < refDate()) break; // referans tarihinden önceye düşme, sonsuz döngüye girme
      if(!dayInfo(d).isRest) break;
    }
    return d;
  }

  // "Beraber vardiya tutulan grup" - E Grubu için: blockDay 1-3 => B, 4-6 => A
  function partnerGroup(blockDay){
    if(blockDay == null) return null;
    return blockDay <= 3 ? 'B Grubu' : 'A Grubu';
  }

  // Tam gün analiz: personel bazlı görev/RZ atamaları döner
  function computeDay(date){
    var info = dayInfo(date);
    var personnel = state.settings.personnel;
    var n = personnel.length;
    var result = {info:info, partner: partnerGroup(info.blockDay), people: []};

    if(info.isRest){ return result; }

    if(info.hatSaha === 'Hat'){
      if(n === 6){
        var tnum = tableNumberFor(date);
        var table = tableForNumber(tnum||1);
        for(var i=0;i<6;i++){ result.people.push({name:personnel[i], task:table[i], rz:false}); }
        result.tableNumber = tnum;
      } else {
        var activeTasks = activeTasksForCount(n);
        var offset = hatOffsetGeneric(date);
        for(var j=0;j<n;j++){
          var task = activeTasks[(j+offset) % activeTasks.length];
          result.people.push({name:personnel[j], task:task, rz:false});
        }
      }
    } else { // Saha
      var rzInfo = computeRZForSahaDay(date, n);
      for(var m=0;m<n;m++){
        var isRZ = rzInfo.flags[m];
        result.people.push({name:personnel[m], task:isRZ?'RZ':'Saha', rz:isRZ});
      }
      result.rzCarried = rzInfo.carried; // Gündüz son gün RZ -> Gece ilk gün RZ devamı mı?
    }
    return result;
  }

  // Bir Saha gününde kimin RZ olduğunu hesaplar.
  // Normal kural: bir önceki çalışma günü Hat idi ve kişi tetikleyici görevi (K, 2 kişide P) yaptıysa RZ.
  // Özel kural (madde 25): önceki çalışma günü de Saha ise (Gündüz'ün son günü -> Gece'nin ilk günü geçişi
  // gibi), o günün kendi RZ durumu olduğu gibi devralınır.
  function computeRZForSahaDay(date, n){
    var personnel = state.settings.personnel;
    var trigger = (n === 2) ? 'P' : 'K';
    var prevD = prevWorkDay(date);
    var prevInfo = dayInfo(prevD);
    var flags = new Array(n).fill(false);

    if(prevInfo.hatSaha === 'Hat'){
      var prevTasksByIndex;
      if(n === 6){
        var ptnum = tableNumberFor(prevD);
        prevTasksByIndex = tableForNumber(ptnum||1);
      } else {
        var pActive = activeTasksForCount(n);
        var pOffset = hatOffsetGeneric(prevD);
        prevTasksByIndex = [];
        for(var k=0;k<n;k++){ prevTasksByIndex.push(pActive[(k+pOffset)%pActive.length]); }
      }
      for(var m=0;m<n;m++){ flags[m] = prevTasksByIndex[m] === trigger; }
      return {flags: flags, carried: false};
    } else if(prevInfo.hatSaha === 'Saha'){
      var carriedFrom = computeRZForSahaDay(prevD, n);
      return {flags: carriedFrom.flags, carried: carriedFrom.flags.some(Boolean)};
    }
    return {flags: flags, carried: false};
  }

  // Personel sayısına göre aktif görevler (madde 18)
  function activeTasksForCount(n){
    if(n>=6) return ['Y','P','S','K','A','6'];
    if(n===5) return ['Y','P','S','K','6'];
    if(n===4) return ['Y','P','S','K'];
    if(n===3) return ['Y','P','K'];
    return ['Y','P'];
  }

  /* ============================================================
     RENDER
  ============================================================ */
  var DOWS = ['P','S','Ç','P','C','C','P'];
  var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  function initials(name){
    return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
  }

  function renderLanding(){
    var grid = document.getElementById('badgeGrid');
    grid.innerHTML = '';
    state.settings.personnel.forEach(function(name, idx){
      var card = document.createElement('button');
      card.className = 'id-card';
      card.innerHTML =
        '<div class="num">SIRA ' + String(idx+1).padStart(2,'0') + '</div>' +
        '<div class="who"><span class="avatar">'+initials(name)+'</span>' +
        '<div><div class="name">'+name+'</div><div class="role">E Grubu</div></div></div>';
      card.addEventListener('click', function(){ selectPerson(name); });
      grid.appendChild(card);
    });
    var groupCard = document.createElement('button');
    groupCard.className = 'id-card group';
    groupCard.innerHTML =
      '<div class="num">GENEL</div>' +
      '<div class="who"><span class="avatar">GG</span>' +
      '<div><div class="name">Tüm Grup</div><div class="role">Herkesi birlikte gör</div></div></div>';
    groupCard.addEventListener('click', function(){ selectPerson('__GROUP__'); });
    grid.appendChild(groupCard);
  }

  function selectPerson(nameOrGroup){
    state.settings.currentPerson = nameOrGroup;
    saveSettings();
    showCalendarScreen();
  }

  function showCalendarScreen(){
    document.getElementById('screen-landing').classList.add('hidden');
    document.getElementById('screen-calendar').classList.remove('hidden');
    document.getElementById('bottomNav').classList.remove('hidden');
    switchTab('takvim');
    var cur = state.settings.currentPerson;
    var isGroup = (cur === '__GROUP__' || !cur);
    document.getElementById('chipAvatar').textContent = isGroup ? 'GG' : initials(cur);
    document.getElementById('chipName').textContent = isGroup ? 'Tüm Grup' : cur.split(' ')[0];
    // Bazı mobil tarayıcılar, bir konteyner display:none'dan görünür hale
    // geldiği anda içine eklenen CSS grid öğelerini doğru düzenlemiyor
    // (takvimin eksik/yarım görünmesine yol açıyordu). Bir sonraki iki
    // paint'e kadar bekleyip öyle render etmek bunu düzeltiyor.
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        renderCalendar();
      });
    });
  }

  /* ---------- alt menü (bottom tab bar) ---------- */
  var TAB_SCREENS = {
    takvim: 'screen-calendar',
    raporlar: 'screen-reports',
    mesailer: 'screen-mesailer',
    dahafazla: 'screen-more'
  };
  function switchTab(tabName){
    Object.keys(TAB_SCREENS).forEach(function(key){
      document.getElementById(TAB_SCREENS[key]).classList.toggle('hidden', key !== tabName);
    });
    document.querySelectorAll('.navtab').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
    });
    if(tabName === 'dahafazla') renderMoreScreen();
    if(tabName === 'raporlar') renderReportsScreen();
    if(tabName === 'mesailer') renderMesailerScreen();
  }
  document.querySelectorAll('.navtab').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.getAttribute('data-tab')); });
  });

  function renderDow(){
    var row = document.getElementById('dowRow');
    row.innerHTML = '';
    DOWS.forEach(function(d){
      var el = document.createElement('div');
      el.className = 'dow'; el.textContent = d;
      row.appendChild(el);
    });
  }

  function shiftClass(shiftType){
    if(shiftType==='Gece') return 'gece';
    if(shiftType==='Dört') return 'dort';
    if(shiftType==='Gündüz') return 'gunduz';
    return '';
  }

  function buildCell(date, day){
    var info = day===null ? null : dayInfo(date);
    var cell = document.createElement('div');
    cell.className = 'cell';
    if(day===null){ cell.classList.add('empty'); return cell; }

    var isToday = (date.getFullYear()===today.getFullYear() && date.getMonth()===today.getMonth() && date.getDate()===today.getDate());
    if(isToday) cell.classList.add('today');

    var cur = state.settings.currentPerson;
    var isGroup = (cur === '__GROUP__' || !cur);

    if(info.isRest){
      cell.classList.add('rest');
      cell.innerHTML = '<div class="datenum">'+day+'</div>';
    } else {
      var sc = shiftClass(info.shiftType);
      cell.classList.add(sc);
      var html = '<div class="datenum">'+day+'</div>';
      html += '<div class="chip '+sc+'">'+info.shiftType+'</div>';

      if(isGroup){
        if(info.hatSaha === 'Hat'){
          html += '<div class="saha-tag" style="color:var(--hat);font-weight:700;">Hat</div>';
        } else {
          var groupDay = computeDay(date);
          var anyRZ = groupDay.people.some(function(p){return p.rz;});
          if(anyRZ) html += '<div class="rz-tag">RZ var</div>';
        }
      } else {
        var dayData = computeDay(date);
        var mine = dayData.people.filter(function(p){return p.name===cur;})[0];
        if(mine){
          if(mine.rz){ html += '<div class="taskcode rz">RZ</div>'; }
          else if(info.hatSaha === 'Hat'){ html += '<div class="taskcode hat">'+mine.task+'</div>'; }
        }
      }
      cell.innerHTML = html;
    }
    cell.addEventListener('click', function(){ openDayDetail(date); });
    return cell;
  }

  function renderCalendar(){
    renderDow();
    var y = state.viewYear, m = state.viewMonth;
    document.getElementById('monthLabel').textContent = MONTHS[m];
    document.getElementById('yearLabel').textContent = y;

    var first = new Date(y,m,1);
    var startOffset = (first.getDay() + 6) % 7; // Pazartesi=0
    var daysInMonth = new Date(y,m+1,0).getDate();

    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    var weekRow = null;
    var cellCount = 0;

    function newWeekRow(){
      var wr = document.createElement('div');
      wr.className = 'weekrow grid7';
      grid.appendChild(wr);
      return wr;
    }

    weekRow = newWeekRow();
    for(var i=0;i<startOffset;i++){
      weekRow.appendChild(buildCell(null,null));
      cellCount++;
    }

    for(var day=1; day<=daysInMonth; day++){
      if(cellCount>0 && cellCount%7===0){ weekRow = newWeekRow(); }
      var date = new Date(y,m,day);
      weekRow.appendChild(buildCell(date, day));
      cellCount++;
    }

    while(cellCount%7!==0){
      weekRow.appendChild(buildCell(null,null));
      cellCount++;
    }
  }

  /* ============================================================
     GÜN DETAY MODAL
  ============================================================ */
  function openDayDetail(date){
    var info = dayInfo(date);
    var dayData = computeDay(date);
    var root = document.getElementById('modalRoot');

    var dowNames = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    var dateStr = date.getDate()+' '+MONTHS[date.getMonth()]+' '+date.getFullYear()+' &middot; '+dowNames[date.getDay()];

    var body = '<div class="sheet-handle"></div>';
    body += '<h2>'+dateStr+'</h2>';

    if(info.isRest){
      body += '<div class="sub">Hafta Tatili</div>';
      body += '<div class="info-row"><span class="k">Durum</span><span class="v">HT (dinlenme günü)</span></div>';
    } else {
      body += '<div class="sub">'+info.shiftType+' vardiyası &middot; '+info.blockDay+'. gün &middot; '+info.hatSaha+'</div>';
      body += '<div class="info-row"><span class="k">Vardiya</span><span class="v">'+info.shiftType+'</span></div>';
      body += '<div class="info-row"><span class="k">Vardiya günü</span><span class="v">'+info.blockDay+' / 6</span></div>';
      body += '<div class="info-row"><span class="k">Durum</span><span class="v">'+info.hatSaha+'</span></div>';
      body += '<div class="info-row"><span class="k">Beraber vardiya</span><span class="v">'+dayData.partner+'</span></div>';

      body += '<table class="person-table"><thead><tr><th>Personel</th><th>Görev</th></tr></thead><tbody>';
      dayData.people.forEach(function(p){
        var label = p.rz ? 'RZ (Rezerve)' : (info.hatSaha==='Hat' ? (TASK_NAMES[p.task]||p.task)+' ('+p.task+')' : 'Saha');
        body += '<tr><td>'+p.name+'</td><td>'+label+'</td></tr>';
      });
      body += '</tbody></table>';
      if(dayData.rzCarried){

  function reportDayCellHtml(date, isGroup, person, personnel){
    var info = dayInfo(date);
    var html = '<div class="cell'+(info.isRest ? ' rest' : '')+'">';
    html += '<div class="datenum">'+date.getDate()+'</div>';
    if(info.isRest){
      html += '</div>';
      return html;
    }
    var sc = shiftClass(info.shiftType);
    html += '<div class="chip '+sc+'">'+info.shiftType+'</div>';
    var dayData = computeDay(date);
    if(isGroup){
      html += '<div class="report-group-tasks">';
      personnel.forEach(function(name){
        var p = dayData.people.filter(function(x){return x.name===name;})[0];
        var initials = name.split(' ').map(function(w){return w[0];}).join('');
        html += '<div><b>'+initials+'</b> '+(p ? p.task : '—')+'</div>';
      });
      html += '</div>';
    } else {
      var mine = dayData.people.filter(function(x){return x.name===person;})[0];
      if(mine){
        if(mine.rz){ html += '<div class="taskcode rz">RZ</div>'; }
        else if(info.hatSaha === 'Hat'){ html += '<div class="taskcode hat">'+mine.task+'</div>'; }
      }
    }
    html += '</div>';
    return html;
  }

  function buildReportCalendar(year, month, person){
    var area = document.getElementById('printArea');
    var isGroup = (person === '__GROUP__');
    var personnel = state.settings.personnel;
    var title = 'E Grubu &middot; ' + MONTHS[month] + ' ' + year + ' &middot; ' + (isGroup ? 'Tüm Grup' : person);

    var first = new Date(year, month, 1);
    var startOffset = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month+1, 0).getDate();

    var html = '<div class="report-title">'+title+'</div>';
    html += '<div class="grid7 report-dow-row">';
    DOWS.forEach(function(d){ html += '<div class="dow">'+d+'</div>'; });
    html += '</div>';

    var cellCount = 0;
    html += '<div class="weekrow grid7'+(isGroup ? ' report-grid-group' : ' report-grid-person')+'">';
    for(var i=0;i<startOffset;i++){ html += '<div class="cell empty"></div>'; cellCount++; }
    for(var d=1; d<=daysInMonth; d++){
      if(cellCount>0 && cellCount%7===0){
        html += '</div><div class="weekrow grid7'+(isGroup ? ' report-grid-group' : ' report-grid-person')+'">';
      }
      html += reportDayCellHtml(new Date(year, month, d), isGroup, person, personnel);
      cellCount++;
    }
    while(cellCount%7!==0){ html += '<div class="cell empty"></div>'; cellCount++; }
    html += '</div>';

    if(isGroup){
      html += '<div class="report-legend">';
      personnel.forEach(function(name){
        var initials = name.split(' ').map(function(w){return w[0];}).join('');
        html += '<span><b>'+initials+'</b> '+name+'</span>';
      });
      html += '</div>';
    }

    area.innerHTML = html;
  }

  var MESAI_STORAGE_KEY = 'erdemirMesaiEntries_v1';

  function loadMesaiEntries(){
    try{
      var raw = localStorage.getItem(MESAI_STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* localStorage yoksa bellekte devam */ }
    return [];
  }
  function saveMesaiEntries(){
    try{ localStorage.setItem(MESAI_STORAGE_KEY, JSON.stringify(mesaiEntries)); }catch(e){}
  }
  var mesaiEntries = loadMesaiEntries();
  var mesaiState = { year: null, month: null, person: null };

  function mesaiEntriesForMonth(year, month){
    var prefix = year + '-' + String(month+1).padStart(2,'0');
    return mesaiEntries.filter(function(e){ return e.date && e.date.indexOf(prefix) === 0; });
  }

  function mesaiSummaryFor(entries, person){
    var list = person ? entries.filter(function(e){ return e.person === person; }) : entries;
    var saat = 0, gun = 0;
    list.forEach(function(e){
      if(e.basis === 'saat') saat += e.amount;
      else gun += e.amount;
    });
    return {saat: saat, gun: gun};
  }

  function formatMesaiSummary(sum){
    var parts = [];
    if(sum.saat) parts.push(sum.saat + ' saat');
    if(sum.gun) parts.push(sum.gun + ' gün');
    return parts.length ? parts.join(' + ') : '—';
  }

  function renderMesaiDynamicParts(){
    var s = state.settings;
    var year = mesaiState.year, month = mesaiState.month;
    var person = mesaiState.person;
    var isGroup = (person === '__GROUP__');
    var monthEntries = mesaiEntriesForMonth(year, month);

    // --- özet ---
    var summaryBox = document.getElementById('mesaiSummaryBox');
    var sHtml = '';
    if(isGroup){
      sHtml += '<div class="mesai-summary-grid">';
      s.personnel.forEach(function(name){
        var sum = mesaiSummaryFor(monthEntries, name);
        sHtml += '<div class="mesai-summary-card"><b>'+name.split(' ')[0]+'</b><span>'+formatMesaiSummary(sum)+'</span></div>';
      });
      sHtml += '</div>';
    } else {
      var sum = mesaiSummaryFor(monthEntries, person);
      sHtml += '<div class="mesai-summary-card mesai-summary-solo"><b>'+person+'</b><span>'+formatMesaiSummary(sum)+'</span></div>';
    }
    summaryBox.innerHTML = sHtml;

    // --- otomatik adaylar: seçili kişi(ler)in bu ayki HT günlerinden henüz kayıt girilmemiş olanlar ---
    var suggestBox = document.getElementById('mesaiSuggestBox');
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var candidates = [];
    var checkPersons = isGroup ? s.personnel : [person];
    for(var d=1; d<=daysInMonth; d++){
      var date = new Date(year, month, d);
      var info = dayInfo(date);
      if(!info.isRest || info.noData) continue;
      var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      checkPersons.forEach(function(name){
        var already = mesaiEntries.some(function(e){ return e.date===dateStr && e.person===name; });
        if(!already) candidates.push({date: dateStr, day: d, person: name});
      });
    }
    var sugHtml = '<label class="flip-label" style="margin-bottom:6px;display:block;">Bu ay HT (dinlenme) gününde mesai olabilecek günler:</label>';
    if(candidates.length === 0){
      sugHtml += '<div class="hint">Bu ay için aday gün yok.</div>';
    } else {
      candidates.forEach(function(c){
        sugHtml += '<div class="mesai-suggest-row"><span>'+c.day+' '+MONTHS[month].slice(0,3)+(isGroup ? ' · '+c.person.split(' ')[0] : '')+'</span>';
        sugHtml += '<button class="add-btn mesai-suggest-btn" data-date="'+c.date+'" data-person="'+c.person+'">+ Ekle</button></div>';
      });
    }
    suggestBox.innerHTML = sugHtml;
    document.querySelectorAll('.mesai-suggest-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.getElementById('mesaiAddDate').value = btn.getAttribute('data-date');
        var personSel = document.getElementById('mesaiAddPerson');
        if(personSel) personSel.value = btn.getAttribute('data-person');
        document.getElementById('mesaiAddAmount').focus();
      });
    });

    // --- kayıt listesi ---
    var logRoot = document.getElementById('mesaiLogRows');
    var logEntries = isGroup ? monthEntries : monthEntries.filter(function(e){ return e.person===person; });
    logEntries.sort(function(a,b){ return a.date.localeCompare(b.date); });
    var logHtml = '';
    if(logEntries.length === 0){
      logHtml = '<div class="hint">Bu ay için kayıt yok.</div>';
    } else {
      logEntries.forEach(function(e){
        var dayNum = +e.date.split('-')[2];
        logHtml += '<div class="mesai-log-row">';
        logHtml += '<div class="mesai-log-main"><b>'+dayNum+' '+MONTHS[month].slice(0,3)+'</b>'+(isGroup ? ' · '+e.person.split(' ')[0] : '')+' · '+e.amount+(e.basis==='saat' ? ' saat' : ' gün')+'</div>';
        if(e.note) logHtml += '<div class="mesai-log-note">'+e.note+'</div>';
        logHtml += '<button class="mesai-del-btn" data-id="'+e.id+'">Sil</button>';
        logHtml += '</div>';
      });
    }
    logRoot.innerHTML = logHtml;
    document.querySelectorAll('.mesai-del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        mesaiEntries = mesaiEntries.filter(function(e){ return e.id !== id; });
        saveMesaiEntries();
        renderMesaiDynamicParts();
      });
    });
  }

      var candidateGorevRef = document.getElementById('refGorev').value || defaultSettings.gorevRef;
      var taskOrderEl = document.getElementById('taskOrderRows');
      var taskCycleEl = document.getElementById('taskCycleRows');
      if(taskOrderEl){
        var order = collectTaskOrderRows();
        var uniqCheck = order.slice().sort().join(',');
        if(!(order.length === 6 && uniqCheck === ['6','A','K','P','S','Y'].join(','))){
          alert('Hat görev sırasında her görev yalnızca bir kişiye atanmalı (tekrar eden görev var).');
          return;
        }
        var cycleOrder = defaultSettings.taskCycleOrder;
        if(taskCycleEl){
          cycleOrder = collectTaskCycleRows();
          var cycleUniqCheck = cycleOrder.slice().sort().join(',');
          if(!(cycleOrder.length === 6 && cycleUniqCheck === ['6','A','K','P','S','Y'].join(','))){
            alert('Görev Değişim Sırasında her görev yalnızca bir kez yer almalı (tekrar eden görev var).');
            return;
          }
        }
        // Seçilen referans tarihinin gerçekten bir hat günü olduğunu, mevcut
        // ayarları geçici olarak değiştirmeden (adaylarla) kontrol et.
        var backup = {gorevRef: state.settings.gorevRef};
        state.settings.gorevRef = candidateGorevRef;
        var checkInfo = dayInfo(parseISO(candidateGorevRef));
        var isValidHatDay = (!checkInfo.isRest && checkInfo.hatSaha === 'Hat');
        state.settings.gorevRef = backup.gorevRef;
        if(!isValidHatDay){
          alert('Seçtiğiniz Hat Görev Sırası referans tarihi bir hat (çalışma) günü değil. Lütfen o kişilerin gerçekten hat görevinde olduğu bir tarih seçin.');
          return;
        }
        state.settings.gorevAnchorAssignment = order;
        state.settings.taskCycleOrder = cycleOrder;
      }
      state.settings.gorevRef = candidateGorevRef;
      saveSettings();
      renderMoreScreen();
    });

      saveSettings();
      renderMoreScreen();
    });

    document.getElementById('switchPersonLink').addEventListener('click', function(){
      goToLanding();
    });

    wrap.innerHTML = '';
    if(entries.length === 0){
      wrap.innerHTML = '<div class="hint" style="margin-top:0;">Henüz eklenmiş bir değişiklik yok.</div>';
    }
    entries.forEach(function(entry, idx){
      var row = document.createElement('div');
      row.className = 'ht-row';
      row.innerHTML =
        '<div class="person-row">' +
          '<input type="date" data-idx="'+idx+'" class="ht-date" value="'+(entry.date||'')+'">' +
          '<button class="rm-btn" data-idx="'+idx+'">&times;</button>' +
        '</div>' +
        '<label class="flip-label">Tersine çevirme başlangıç günü (bu bloğun kaçıncı gününden itibaren Hat/Saha sırası tersine dönsün — boş bırakılırsa tersine çevirme uygulanmaz):' +
        '<input type="number" min="1" max="6" data-idx="'+idx+'" class="ht-flipday" placeholder="ör. 3" value="'+(entry.flipFromDay||'')+'" style="width:64px;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;"></label>';
      wrap.appendChild(row);
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.rm-btn'), function(btn){
      btn.addEventListener('click', function(){
        var cur = collectHtRows();
        cur.splice(+btn.getAttribute('data-idx'),1);
        renderHtRows(cur);
      });
    });
  }
  function collectHtRows(){
    var dateInputs = document.querySelectorAll('#htRows .ht-date');
    var flipInputs = document.querySelectorAll('#htRows .ht-flipday');
    return Array.prototype.map.call(dateInputs, function(inp, i){
      return {date: inp.value, flipFromDay: flipInputs[i] ? flipInputs[i].value : ''};
    });
  }

  function renderTaskOrderRows(personnel, assignment){
    var wrap = document.getElementById('taskOrderRows');
    if(!wrap) return;
    wrap.innerHTML = '';
    var letters = ['Y','P','S','K','A','6'];
    personnel.forEach(function(name, idx){
      var row = document.createElement('div');
      row.className = 'person-row';
      var sel = '<select data-idx="'+idx+'" class="task-order-select" style="flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);">';
      letters.forEach(function(letter){
        var selected = (assignment[idx] === letter) ? ' selected' : '';
        sel += '<option value="'+letter+'"'+selected+'>'+TASK_NAMES[letter]+'</option>';
      });
      sel += '</select>';
      row.innerHTML = '<span style="flex:0 0 auto;min-width:110px;font-size:13.5px;font-weight:600;color:var(--ink);">'+name+'</span>'+sel;
      wrap.appendChild(row);
    });
  }
  function collectTaskOrderRows(){
    var selects = document.querySelectorAll('#taskOrderRows .task-order-select');
    return Array.prototype.map.call(selects, function(sel){ return sel.value; });
  }

  function renderTaskCycleRows(order){
    var wrap = document.getElementById('taskCycleRows');
    if(!wrap) return;
    wrap.innerHTML = '';
    var letters = ['Y','P','S','K','A','6'];
    order.forEach(function(task, idx){
      var row = document.createElement('div');
      row.className = 'person-row';
      var sel = '<select data-idx="'+idx+'" class="task-cycle-select" style="flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);">';
      letters.forEach(function(letter){
        var selected = (task === letter) ? ' selected' : '';
        sel += '<option value="'+letter+'"'+selected+'>'+TASK_NAMES[letter]+'</option>';
      });
      sel += '</select>';
      row.innerHTML = '<span style="flex:0 0 auto;min-width:44px;font-size:13.5px;font-weight:700;color:var(--ink-muted);">'+(idx+1)+'.</span>'+sel;
      wrap.appendChild(row);
    });
  }
  function collectTaskCycleRows(){
    var selects = document.querySelectorAll('#taskCycleRows .task-cycle-select');
    return Array.prototype.map.call(selects, function(sel){ return sel.value; });
  }

  function renderPersonRows(names){
    var wrap = document.getElementById('personRows');
    wrap.innerHTML = '';
    names.forEach(function(name, idx){
      var row = document.createElement('div');
      row.className = 'person-row';
      row.innerHTML = '<input type="text" data-idx="'+idx+'" value="'+name.replace(/"/g,'&quot;')+'" placeholder="Ad Soyad">' +
        (names.length > 2 ? '<button class="rm-btn" data-idx="'+idx+'">&times;</button>' : '');
      wrap.appendChild(row);
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.rm-btn'), function(btn){
      btn.addEventListener('click', function(){
        var cur = collectPersonRows();
        cur.splice(+btn.getAttribute('data-idx'),1);
        renderPersonRows(cur);
      });
    });
  }
  function collectPersonRows(){
    var inputs = document.querySelectorAll('#personRows input');
    return Array.prototype.map.call(inputs, function(inp){ return inp.value; });
  }

  function goToLanding(){
    document.getElementById('screen-calendar').classList.add('hidden');
    document.getElementById('screen-reports').classList.add('hidden');
    document.getElementById('screen-mesailer').classList.add('hidden');
    document.getElementById('screen-more').classList.add('hidden');
    document.getElementById('bottomNav').classList.add('hidden');
    document.getElementById('screen-landing').classList.remove('hidden');
    renderLanding();
  }

  /* ============================================================
     EVENTS
  ============================================================ */
  document.getElementById('prevMonth').addEventListener('click', function(){
    state.viewMonth--; if(state.viewMonth<0){state.viewMonth=11; state.viewYear--;}
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    state.viewMonth++; if(state.viewMonth>11){state.viewMonth=0; state.viewYear++;}
    renderCalendar();
  });

  /* ============================================================
     BAŞLAT
  ============================================================ */
  renderLanding();
  if(state.settings.currentPerson){
    showCalendarScreen();
  }
})();
</script>
</body>
</html>
